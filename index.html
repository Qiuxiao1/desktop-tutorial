<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>跳转网页练习</title>
    <style>
        /* 简单美化一下，可选 */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 100px;
            font-family: sans-serif;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h3>Git练习页面</h3>
    <!-- 把href里面的地址换成你想要打开的网站 -->
    <button onclick="window.open('https://www.baidu.com')">点击打开网站</button>
</body>
</html>
